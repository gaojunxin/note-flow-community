name: Community CI
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: community-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: Community ${{ matrix.platform }} x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-22.04
            bundles: all
          - platform: windows
            runner: windows-2022
            bundles: nsis
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Select stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE) { throw 'Rust toolchain installation failed' }
          rustup default stable
          if ($LASTEXITCODE) { throw 'Rust toolchain selection failed' }
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 xvfb xauth
      - name: Check Windows portable prerequisites
        if: runner.os == 'Windows'
        run: |
          $extractor = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          if (!(Get-Command 7z -ErrorAction SilentlyContinue) -and !(Test-Path -LiteralPath $extractor)) { throw '7-Zip is required for the portable ZIP' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (!(Test-Path -LiteralPath $vswhere)) { throw 'Visual Studio locator is missing' }
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs -or !(Test-Path -LiteralPath (Join-Path $vs 'VC/Redist/MSVC'))) { throw 'Visual Studio x64 tools and redistributable CRT are required' }
      - name: Read release version
        id: release
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag must match version.json exactly' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Install public dependencies
        run: npm ci
      - name: Build and test Linux installer and portable package
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: xvfb-run -a pwsh -NoProfile -File ./scripts/build-pc.ps1 -Bundles ${{ matrix.bundles }} -SkipInstall
      - name: Build and test Windows installer and portable package
        if: runner.os == 'Windows'
        run: ./scripts/build-pc.ps1 -Bundles ${{ matrix.bundles }} -SkipInstall
      - name: Verify delivery formats and manifest hashes
        run: node scripts/verify-community-artifacts.mjs --platform ${{ matrix.platform }}
      - name: Upload desktop packages
        uses: actions/upload-artifact@v7
        with:
          name: community-${{ matrix.platform }}-x64-${{ steps.release.outputs.version }}
          path: artifacts/pc/${{ steps.release.outputs.version }}/community/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: desktop
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Download packages from this workflow run
        uses: actions/download-artifact@v8
        with:
          pattern: community-*-x64-*
          path: artifacts/release-input
          merge-multiple: false
      - name: Recheck packages and prepare release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/prepare-community-release.mjs
      - name: Upload complete draft and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" artifacts/release-assets/* --verify-tag --draft --title "NoteFlow Community $RELEASE_TAG" --notes-file artifacts/release-notes.md
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release edit "$RELEASE_TAG" --draft=false "${flags[@]}"
