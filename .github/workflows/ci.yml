name: Community CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: community-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Select stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Install desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install public dependencies
        run: npm ci
      - name: Build and test public Linux candidate
        shell: pwsh
        run: ./scripts/build-pc.ps1 -Bundles deb -SkipInstall
      - uses: actions/upload-artifact@v4
        with:
          name: community-linux
          path: artifacts/pc/*/community/*
          if-no-files-found: error
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install public Android toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973'
          rustup target add aarch64-linux-android
      - name: Build and test public Android candidate
        shell: pwsh
        run: ./scripts/build-android.ps1 -Configuration Debug
      - uses: actions/upload-artifact@v4
        with:
          name: community-android-debug
          path: artifacts/mobile/*/debug/community/*
          if-no-files-found: error
