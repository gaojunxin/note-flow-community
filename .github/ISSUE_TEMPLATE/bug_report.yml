name: 缺陷报告
description: 使用合成数据报告社区版问题
title: "[Bug] "
body:
  - type: input
    id: version
    attributes:
      label: 版本与平台
      description: 请提供 manifest 版本、系统及 Web/Linux/Android。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请使用合成样本，不附账号、令牌、主密码或真实备份。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 实际结果与预期结果
    validations:
      required: true
